<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lyssna — Caliche Records</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Vazirmatn:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --dark:#0e0b08;--darker:#080604;--brown:#8B4513;--gold:#C8A882;--gold-dim:#8a6a4a;--dust:#F5F0EB;--gray:#6a6050;--mid:#3a2e22;--red:#e0702a; }
  body { background:var(--darker);color:var(--dust);font-family:'EB Garamond',Georgia,serif;font-size:18px;line-height:1.6;min-height:100vh;-webkit-tap-highlight-color:transparent; }
  body::before { content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%, rgba(139,69,19,0.15) 0%, transparent 60%);pointer-events:none;z-index:0; }
  .wrap { position:relative;z-index:1;max-width:720px;margin:0 auto;padding:0 20px 80px; }

  header { position:sticky;top:0;z-index:50;background:rgba(8,6,4,0.96);box-shadow:0 1px 0 rgba(58,46,34,0.4);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px; }
  .logo { font-family:'Playfair Display',serif;font-size:14px;font-weight:700;letter-spacing:0.2em;white-space:nowrap;text-transform:uppercase;color:#E2C9A6; }
  .logo span { opacity:.85 }
  .linkbtn { background:none;border:none;font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:400;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);cursor:pointer;padding:6px 0; }
  .linkbtn:hover { color:var(--dust); }
  header .linkbtn { letter-spacing:0.12em;white-space:nowrap; }

  .eyebrow { font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:0.5em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px; }
  .dot { width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulseDot 2s infinite; }
  h1 { font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(38px,9vw,56px);line-height:0.95;color:var(--dust);margin:14px 0 6px; }
  h1 em { color:var(--gold);font-style:italic;font-weight:400; }
  .sub { font-family:'Playfair Display',serif;font-style:italic;color:var(--gold);letter-spacing:0.05em;font-size:17px; }
  .rule { height:1px;background:linear-gradient(90deg,transparent,var(--mid),transparent);margin:28px 0; }
  .help { color:#b0a090;font-style:italic;font-size:16px; }

  .btn { display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);background:none;border:1px solid rgba(200,168,130,.4);padding:14px 26px;cursor:pointer;transition:all .3s cubic-bezier(0.16,1,0.3,1);min-height:48px; }
  .btn:hover { border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 32px rgba(200,168,130,.2); }
  .btn:disabled { opacity:.4;cursor:default;transform:none;box-shadow:none; }
  .btn.full { width:100%; }
  .btn.small { padding:8px 14px;font-size:12px;min-height:36px; }

  label.field { display:block;margin-bottom:18px; }
  label.field > span { display:block;font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);margin-bottom:6px; }
  input[type=text], input[type=email], input[type=password], select, textarea { width:100%;background:var(--dark);border:1px solid var(--mid);color:var(--dust);font-family:'EB Garamond',Georgia,serif;font-size:18px;padding:12px 14px;border-radius:0;outline:none;transition:border-color .3s; }
  input:focus, select:focus, textarea:focus { border-color:var(--gold-dim); }
  textarea { min-height:110px;resize:vertical; }
  .fa { font-family:'Vazirmatn','EB Garamond',sans-serif;direction:rtl;text-align:right; }
  input[type=file] { color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:15px; }
  .err { color:var(--red);font-size:16px;margin-top:10px;min-height:1em; }
  .ok { color:var(--gold);font-size:16px;margin-top:10px; }

  .card { display:block;width:100%;text-align:left;background:#100c07;border:1px solid rgba(200,168,130,0.15);padding:18px 20px;margin-bottom:12px;cursor:pointer;color:inherit;font:inherit;position:relative;overflow:hidden;transition:all .3s cubic-bezier(0.16,1,0.3,1); }
  .card:hover { border-color:rgba(200,168,130,0.45);background:#120d08;transform:translateX(8px); }
  .card-title { font-family:'Playfair Display',serif;font-weight:700;font-size:22px;color:var(--dust);line-height:1.2; }
  .card-meta { font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:0.18em;text-transform:uppercase;color:#b0a090;margin-top:6px; }
  .badge { display:inline-block;margin-left:8px;color:var(--red);letter-spacing:0.1em; }

  .player { position:sticky;top:57px;z-index:40;background:rgba(14,11,8,0.97);border:1px solid var(--mid);padding:12px;margin:18px 0 10px; }
  .player audio { width:100%;display:block; }
  .ctrls { display:flex;gap:10px;margin-top:10px; }
  .ctrls .btn { flex:1;font-size:16px;letter-spacing:.15em;padding:14px 10px; }
  .player .help { font-size:14px;margin-top:6px;text-align:center; }

  .lyrics { margin-top:10px; }
  .tag { font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);margin:26px 0 8px;direction:ltr; }
  .line { font-family:'Vazirmatn',sans-serif;direction:rtl;text-align:right;font-size:22px;line-height:2.1;padding:2px 0; }
  .w { display:inline-block;padding:0 4px;margin:0 1px;border-bottom:1px solid transparent;cursor:pointer;transition:all .2s; }
  .w:hover { color:var(--gold); }
  .w.has { color:var(--red);border-bottom-color:var(--red); }
  .w.done { color:var(--gold);border-bottom:1px dashed var(--gold-dim); }
  .w.chg { color:#f0d9b5;background:rgba(200,168,130,0.12);border-bottom-color:var(--gold); }
  .w.chg.open { border-bottom-color:var(--red); }
  .sv { font-family:'EB Garamond',Georgia,serif;direction:ltr;text-align:left;font-size:19px;line-height:1.7;padding:2px 0; }
  .sv-under { font-family:'EB Garamond',Georgia,serif;direction:ltr;text-align:left;font-style:italic;color:#b0a090;font-size:16px;line-height:1.5;margin:-2px 0 10px; }
  .tabs { display:flex;border-bottom:1px solid var(--mid);margin:22px 0 6px; }
  .tab { flex:1;background:none;border:none;border-bottom:2px solid transparent;color:#b0a090;font-family:'Cormorant Garamond',serif;letter-spacing:.2em;text-transform:uppercase;font-size:14px;padding:12px 0;cursor:pointer; }
  .tab.on { color:var(--gold);border-bottom-color:var(--gold); }
  .chips { display:flex;gap:8px;flex-wrap:wrap;margin-top:14px; }
  .chip { font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.15em;text-transform:uppercase;border:1px solid var(--mid);padding:4px 10px;color:var(--gray); }
  .chip.yes { color:var(--gold);border-color:rgba(200,168,130,.4); }
  .notice { font-style:italic;color:var(--gold);font-size:15px;text-align:center;border:1px dashed var(--gold-dim);padding:6px;margin-top:10px; }
  .sub-h { font-family:'Playfair Display',serif;font-size:19px;color:var(--dust);margin:22px 0 10px; }
  .item { display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--mid);padding:10px 0; }
  .item .card-meta { margin-top:2px; }
  .item.on .card-title { color:var(--gold); }
  .box { border:1px solid var(--mid);padding:16px;margin-top:12px; }
  .grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:18px; }
  .vcard { background:none;border:none;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit;display:flex;flex-direction:column;justify-content:flex-start; }
  a.btn { text-decoration:none; }
  .thumb { position:relative;aspect-ratio:16/9;background:#100c07 center/cover no-repeat;border:1px solid rgba(200,168,130,0.15);transition:border-color .3s; }
  .vcard:hover .thumb { border-color:rgba(200,168,130,0.5); }
  .thumb .len { position:absolute;right:6px;bottom:6px;background:rgba(8,6,4,0.85);color:var(--dust);font-size:13px;padding:1px 6px; }
  .vcard .card-title { font-size:16px;margin-top:6px; }
  .vplayer { width:100%;max-height:70vh;background:#000;display:block;margin:18px 0 10px; }

  .corr { border-left:1px solid var(--brown);padding:10px 0 10px 14px;margin-bottom:14px; }
  .corr .word { font-family:'Vazirmatn',sans-serif;font-size:20px;color:var(--dust); }
  .corr .det { font-size:16px;color:#b0a090; }
  .corr .det b { font-weight:500;color:var(--gold);font-family:'Cormorant Garamond',serif;letter-spacing:0.15em;text-transform:uppercase;font-size:12px;margin-right:6px; }
  .corr.done { opacity:.7;border-left-color:var(--gold-dim); }
  .row { display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px; }

  .sheet-bg { position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:none; }
  .sheet { position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--dark);border-top:1px solid var(--gold-dim);padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(0.16,1,0.3,1); }
  .sheet.open { transform:translateY(0); }
  .sheet-inner { max-width:680px;margin:0 auto; }
  .sheet .big { font-family:'Vazirmatn',sans-serif;font-size:30px;color:var(--gold);direction:rtl;text-align:center;margin:6px 0 2px; }
  .sheet .ctx { font-family:'Vazirmatn',sans-serif;direction:rtl;text-align:center;color:#b0a090;font-size:16px;margin-bottom:18px; }

  .btn.danger { color:var(--red);border-color:rgba(224,112,42,.5); }
  .btn.danger:hover { border-color:var(--red);box-shadow:0 8px 32px rgba(224,112,42,.2); }
  .warn { border:1px solid var(--red);background:rgba(224,112,42,.08);padding:16px;margin:10px 0 18px;color:var(--dust);font-size:17px; }
  .warn strong { display:block;font-family:'Cormorant Garamond',serif;letter-spacing:.3em;text-transform:uppercase;color:var(--red);font-size:14px;margin-bottom:6px; }
  .hidden { display:none !important; }
  .fade { animation:fadeUp .6s cubic-bezier(0.16,1,0.3,1); }
  @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.3;transform:scale(0.6)} }
  footer { position:relative;z-index:1;border-top:1px solid var(--mid);padding:22px 20px;text-align:center;font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:0.15em;color:#b0a090; }
</style>
</head>
<body>

<header>
  <div class="logo">Caliche Records <span>INT</span></div>
  <button class="linkbtn hidden" id="logoutBtn">Logga ut</button>
</header>

<main class="wrap" id="app"></main>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="sheet-inner" id="sheetInner"></div></div>

<footer>Caliche Records International · Endast för inbjudna</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://tvsgupgoqltuktffkfrx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9iZmfnAENWhuznPDRzKOig_igxZNIj6';
const DEFAULT_EMAIL = 'ajsan@calicherecords.com';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const app = document.getElementById('app');
const logoutBtn = document.getElementById('logoutBtn');
const sheet = document.getElementById('sheet'), sheetBg = document.getElementById('sheetBg'), sheetInner = document.getElementById('sheetInner');
let state = { songs: [], takes: [], corrections: [], videos: [], vtab: 'short', song: null, songTakes: [], list: [], takeId: null, urls: {}, showOrig: false, view: 'fa' };
try { state.view = localStorage.getItem('lyssnaView') || 'fa'; } catch (e) {}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = t => { if (t == null) return ''; t = Math.floor(t); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); };
const kindName = k => k === 'full' ? 'Hela låten' : 'A cappella';
const $ = id => document.getElementById(id);
const same = (a, b) => a != null && b != null && String(a) === String(b);

function parseLyrics(text) {
  return text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length)
    .map(l => /^\[.*\]$/.test(l) ? { type:'tag', text:l.slice(1,-1) } : { type:'line', text:l });
}
const lyricsToText = arr => (arr || []).map(l => l.type === 'tag' ? `[${l.text}]` : l.text).join('\n');
const lineCount = arr => (arr || []).filter(l => l.type === 'line').length;

/* ---------- Routing ---------- */
function go(hash) { location.hash = hash; }
window.addEventListener('hashchange', route);

async function route() {
  const { data: { session } } = await sb.auth.getSession();
  logoutBtn.classList.toggle('hidden', !session);
  if (!session) return renderLogin();
  const h = location.hash.replace(/^#/, '');
  if (h.startsWith('song/')) return renderSong(h.slice(5));
  if (h.startsWith('take/')) {   // gamla länkar
    const t = await sb.from('takes').select('id,song_id').eq('id', h.slice(5)).single();
    if (!t.error) { state.takeId = t.data.id; return go('song/' + t.data.song_id); }
  }
  if (h === 'ny') return renderNew();
  if (h === 'video/ny') return renderVideoNew();
  if (h.startsWith('video/')) return renderVideo(h.slice(6));
  if (h === 'video') return renderVideos();
  return renderList();
}

/* ---------- Login ---------- */
function renderLogin() {
  app.innerHTML = `
  <section class="fade" style="padding-top:56px">
    <div class="eyebrow"><span class="dot"></span>Studio</div>
    <h1>Lyssna <em>&amp; rätta</em></h1>
    <p class="sub">Texter och ljudfiler</p>
    <div class="rule"></div>
    <form id="loginForm">
      <label class="field hidden" id="emailField"><span>Användare</span>
        <input type="email" id="email" value="${DEFAULT_EMAIL}" autocomplete="username"></label>
      <label class="field"><span>Lösenord</span>
        <input type="password" id="pw" autocomplete="current-password" required></label>
      <button class="btn full" type="submit">Logga in</button>
      <div class="err" id="loginErr"></div>
    </form>
    <p style="margin-top:20px;text-align:center"><button class="linkbtn" id="otherUser">Annan användare</button></p>
  </section>`;
  $('otherUser').onclick = () => { $('emailField').classList.remove('hidden'); $('otherUser').classList.add('hidden'); };
  $('loginForm').onsubmit = async e => {
    e.preventDefault();
    const err = $('loginErr'); err.textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value });
    if (error) { err.textContent = 'Fel lösenord. Försök igen.'; return; }
    route();
  };
}
logoutBtn.onclick = async () => { await sb.auth.signOut(); go(''); route(); };

/* ---------- Data ---------- */
async function loadAll() {
  const [s, t, c] = await Promise.all([
    sb.from('songs').select('*').order('created_at', { ascending:false }),
    sb.from('takes').select('id,song_id,label,kind,audio_path,created_at').order('created_at', { ascending:false }),
    sb.from('corrections').select('id,song_id,status')
  ]);
  if (s.error || t.error || c.error) throw (s.error || t.error || c.error);
  state.songs = s.data; state.takes = t.data; state.corrections = c.data;
  await loadVideos();
}
async function loadVideos() {
  const v = await sb.from('videos').select('*').order('created_at', { ascending:false });
  state.videos = v.error ? [] : v.data;
}
const sectionNav = cur => `
  <div class="tabs" style="margin:0 0 6px">
    <button class="tab ${cur === 'songs' ? 'on' : ''}" data-nav="">Låtar</button>
    <button class="tab ${cur === 'video' ? 'on' : ''}" data-nav="video">Videoklipp</button>
  </div>`;
const bindNav = () => app.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => go(b.dataset.nav));

async function uploadAudio(songId, file, label, kind) {
  const ext = (file.name.split('.').pop() || 'mp3').toLowerCase().replace(/[^a-z0-9]/g, '');
  const path = `${songId}/${Date.now()}.${ext}`;
  const up = await sb.storage.from('audio').upload(path, file, { contentType: file.type || 'audio/mpeg' });
  if (up.error) throw up.error;
  const t = await sb.from('takes').insert({ song_id: songId, label, kind, audio_path: path }).select().single();
  if (t.error) { await sb.storage.from('audio').remove([path]); throw t.error; }
  return t.data;
}
const uploadErr = e => 'Uppladdningen misslyckades' + (e?.message?.includes('size') ? ': filen är för stor (max 50 MB).' : '. Försök igen.');

/* ---------- Song list ---------- */
async function renderList() {
  app.innerHTML = `<p class="help" style="padding-top:40px">Hämtar…</p>`;
  try { await loadAll(); } catch (e) { app.innerHTML = `<p class="err" style="padding-top:40px">Kunde inte hämta låtarna.</p>`; return; }
  const songsHtml = state.songs.map(song => {
    const nTakes = state.takes.filter(t => same(t.song_id, song.id)).length;
    const open = state.corrections.filter(c => same(c.song_id, song.id) && c.status !== 'klar').length;
    return `
      <button class="card" data-song="${song.id}">
        <div class="card-meta" style="margin:0 0 4px">${esc(song.artist)}</div>
        <div class="card-title">${esc(song.title)}</div>
        <div class="chips">
          <span class="chip ${song.lyrics?.length ? 'yes' : ''}">Text ${song.lyrics?.length ? 'finns' : 'saknas'}</span>
          <span class="chip ${song.lyrics_sv?.length ? 'yes' : ''}">Svenska ${song.lyrics_sv?.length ? 'finns' : 'saknas'}</span>
          <span class="chip ${nTakes ? 'yes' : ''}">${nTakes ? (nTakes === 1 ? '1 ljudfil' : nTakes + ' ljudfiler') : 'Ljud saknas'}</span>
          ${state.videos.some(v => same(v.song_id, song.id)) ? '<span class="chip yes">Video finns</span>' : ''}
          ${open ? `<span class="chip" style="color:var(--red);border-color:rgba(224,112,42,.5)">${open} att rätta</span>` : ''}
        </div>
      </button>`;
  }).join('');
  app.innerHTML = `
  <section class="fade" style="padding-top:24px">
    ${sectionNav('songs')}
    <div class="eyebrow" style="margin-top:22px"><span class="dot"></span>Studio</div>
    <h1>Låtar</h1>
    <p class="sub">Tryck på en låt för att lyssna och rätta</p>
    <div class="rule"></div>
    ${songsHtml || '<p class="help">Inga låtar än.</p>'}
    <div class="rule"></div>
    <button class="btn full" id="newBtn">+ Ny låt</button>
  </section>`;
  bindNav();
  app.querySelectorAll('[data-song]').forEach(b => b.onclick = () => go('song/' + b.dataset.song));
  $('newBtn').onclick = () => go('ny');
}

/* ---------- Song view ---------- */
async function renderSong(id) {
  app.innerHTML = `<p class="help" style="padding-top:40px">Hämtar…</p>`;
  const [s, t, c, v] = await Promise.all([
    sb.from('songs').select('*').eq('id', id).single(),
    sb.from('takes').select('id,song_id,label,kind,audio_path,created_at').eq('song_id', id).order('created_at', { ascending:false }),
    sb.from('corrections').select('*').eq('song_id', id).order('created_at'),
    sb.from('videos').select('id,title,duration_sec').eq('song_id', id).order('created_at', { ascending:false })
  ]);
  if (s.error) { app.innerHTML = `<p class="err" style="padding-top:40px">Låten hittades inte.</p>`; return; }
  if (!same(state.song?.id, id)) state.showOrig = false;
  state.song = s.data; state.songTakes = t.data || []; state.list = c.data || [];
  const songVideos = v.error ? [] : v.data;
  if (!state.songTakes.some(x => same(x.id, state.takeId))) state.takeId = state.songTakes[0]?.id || null;
  const song = state.song, hasFa = !!song.lyrics?.length;

  app.innerHTML = `
  <section class="fade" style="padding-top:28px">
    <button class="linkbtn" id="backBtn">← Alla låtar</button>
    <div class="eyebrow" style="margin-top:18px"><span class="dot"></span>${esc(song.artist)}</div>
    <h1 style="font-size:clamp(32px,8vw,46px)">${esc(song.title)}</h1>
    <div class="player" id="player"></div>
    ${hasFa || song.lyrics_sv?.length ? `
      <div class="tabs">
        <button class="tab" data-view="fa">Persiska</button>
        <button class="tab" data-view="sv">Svenska</button>
        <button class="tab" data-view="both">Båda</button>
      </div>
      <div class="row" id="toolbar" style="justify-content:space-between"></div>
      <div id="origNotice"></div>
      <div class="lyrics" id="lyrics"></div>
      <div class="rule"></div>
      <div class="eyebrow">Ändringar</div>
      <div id="corrList" style="margin-top:16px"></div>`
    : `<div class="rule"></div><p class="help">Ingen text än. Lägg till den under <i>Text</i> nedan.</p>`}
    <div class="rule"></div>
    <div class="eyebrow">Hantera låten</div>

    <div class="sub-h">Ljudfiler</div>
    <div id="takeList"></div>
    <button class="btn full" id="addAudioBtn" style="margin-top:12px">+ Lägg till ljudfil</button>
    <div class="box hidden" id="addAudioBox">
      <label class="field"><span>Namn på ljudfilen</span><input type="text" id="aLabel" placeholder="t.ex. A cappella-test 2"></label>
      <label class="field"><span>Typ</span><select id="aKind"><option value="acappella">A cappella</option><option value="full">Hela låten</option></select></label>
      <label class="field"><span>Ljudfil (mp3)</span><input type="file" id="aFile" accept="audio/*"></label>

      <div class="err" id="aErr"></div>
    </div>

    <div class="sub-h">Text</div>
    ${hasFa ? `
      <div class="row">
        <button class="btn" id="svEditBtn" style="flex:1">${song.lyrics_sv?.length ? 'Redigera svenska' : '+ Lägg till svenska'}</button>
        <button class="btn danger" id="delTextBtn" style="flex:1">Ta bort texten</button>
      </div>
      <div class="box hidden" id="svBox">
        <label class="field"><span>Svensk översättning (en rad per persisk rad)</span><textarea id="svText" style="min-height:220px">${esc(lyricsToText(song.lyrics_sv))}</textarea></label>
        <div class="row"><button class="btn" id="svSave" style="flex:1">Spara</button><button class="btn" id="svCancel" style="flex:1">Avbryt</button></div>
        <div class="err" id="svErr"></div>
      </div>`
    : `
      <div class="box">
        <label class="field"><span>Persisk text (klistra in från Suno)</span><textarea id="tFa" class="fa" style="min-height:200px"></textarea></label>
        <label class="field"><span>Svensk översättning (frivilligt)</span><textarea id="tSv" style="min-height:160px"></textarea></label>
        <button class="btn full" id="tSave">Spara texten</button>
        <div class="err" id="tErr"></div>
      </div>`}

    <div class="sub-h">Videoklipp</div>
    ${songVideos.length ? songVideos.map(x => `
      <div class="item">
        <div><div class="card-title" style="font-size:18px">${esc(x.title)}</div><div class="card-meta">${fmtTime(x.duration_sec)}</div></div>
        <button class="btn small" data-video="${x.id}">▶ Titta</button>
      </div>`).join('') : '<p class="help">Inget videoklipp kopplat till låten.</p>'}
    <button class="btn full" id="addVideoBtn" style="margin-top:12px">+ Lägg till video</button>

    <div class="rule"></div>
    <button class="btn danger full" id="delSong">Radera hela låten</button>
  </section>`;

  $('backBtn').onclick = () => go('');
  app.querySelectorAll('[data-video]').forEach(b => b.onclick = () => go('video/' + b.dataset.video));
  $('addVideoBtn').onclick = () => { state.newVideoSong = song.id; go('video/ny'); };
  app.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
    state.view = b.dataset.view; try { localStorage.setItem('lyssnaView', state.view); } catch (e) {}
    renderText();
  });
  renderPlayer();
  renderTakes();
  if ($('lyrics')) renderText();
  bindManage();
}

async function audioUrl(take) {
  if (!take?.audio_path) return '';
  if (state.urls[take.id]) return state.urls[take.id];
  const s = await sb.storage.from('audio').createSignedUrl(take.audio_path, 60 * 60 * 6);
  return s.error ? '' : (state.urls[take.id] = s.data.signedUrl);
}

async function renderPlayer(seek) {
  const box = $('player'), take = state.songTakes.find(x => same(x.id, state.takeId));
  if (!take) { box.innerHTML = `<p class="help">Ingen ljudfil. Du kan ändå rätta i texten.</p>`; return; }
  const url = await audioUrl(take);
  box.innerHTML = `
    ${state.songTakes.length > 1 ? `<select id="takeSel" style="margin-bottom:10px;font-size:16px;padding:8px 10px">${state.songTakes.map(t => `<option value="${t.id}" ${same(t.id, take.id) ? 'selected' : ''}>${esc(t.label)} · ${kindName(t.kind)}</option>`).join('')}</select>`
      : `<div class="card-meta" style="margin:0 0 8px">${esc(take.label)} · ${kindName(take.kind)}</div>`}
    ${url ? `<audio id="audio" controls preload="metadata" src="${esc(url)}"></audio>
    <div class="ctrls">
      <button class="btn" id="back15">⟲ 15 sek</button>
      <button class="btn" id="playBtn">▶ Spela</button>
    </div>` : '<p class="help">Ljudfilen kunde inte hämtas.</p>'}
    <p class="help">Pausa och tryck på ett ord för att ändra det</p>`;
  const sel = $('takeSel');
  if (sel) sel.onchange = () => { state.takeId = sel.value; renderPlayer(); renderTakes(); };
  const au = $('audio');
  if (au) {
    const pb = $('playBtn');
    const sync = () => { pb.textContent = au.paused ? '▶ Spela' : '❚❚ Paus'; };
    pb.onclick = () => au.paused ? au.play() : au.pause();
    $('back15').onclick = () => { au.currentTime = Math.max(0, au.currentTime - 15); };
    au.addEventListener('play', sync); au.addEventListener('pause', sync);
    if (seek != null) au.addEventListener('loadedmetadata', () => { au.currentTime = Math.max(0, seek - 2); au.play(); }, { once:true });
  }
}

function renderTakes() {
  const box = $('takeList');
  box.innerHTML = state.songTakes.length ? state.songTakes.map(t => `
    <div class="item ${same(t.id, state.takeId) ? 'on' : ''}">
      <div>
        <div class="card-title" style="font-size:18px">${esc(t.label)}</div>
        <div class="card-meta">${kindName(t.kind)} · ${new Date(t.created_at).toLocaleDateString('sv-SE')}</div>
      </div>
      <div class="row" style="margin:0;flex-wrap:nowrap">
        ${same(t.id, state.takeId) ? '' : `<button class="btn small" data-play="${t.id}">Spela</button>`}
        <button class="btn small danger" data-deltake="${t.id}">Ta bort</button>
      </div>
    </div>`).join('') : '<p class="help">Ingen ljudfil än.</p>';
  box.querySelectorAll('[data-play]').forEach(b => b.onclick = () => { state.takeId = b.dataset.play; renderPlayer(); renderTakes(); window.scrollTo({ top:0, behavior:'smooth' }); });
  box.querySelectorAll('[data-deltake]').forEach(b => b.onclick = () => {
    const t = state.songTakes.find(x => same(x.id, b.dataset.deltake));
    confirmDelete(`Ljudfilen <b>${esc(t.label)}</b> raderas för alltid. Texten och ändringarna finns kvar.`, async () => {
      if (t.audio_path) { const rm = await sb.storage.from('audio').remove([t.audio_path]); if (rm.error) throw rm.error; }
      const d = await sb.from('takes').delete().eq('id', t.id); if (d.error) throw d.error;
      delete state.urls[t.id];
      renderSong(state.song.id);
    });
  });
}

/* ---------- Text & edits ---------- */
// Originalet i songs.lyrics ändras aldrig. Varje ändring är en rad i corrections; den senaste vinner.
const editsFor = (i, wi, w) => state.list.filter(x => x.line_index === i && (x.word_index != null ? x.word_index === wi : x.word === w));
function currentWord(i, wi, w) {
  const e = editsFor(i, wi, w).filter(x => x.new_word);
  return e.length ? e[e.length - 1].new_word : w;
}
const currentLine = i => (state.song.lyrics[i]?.text || '').split(/\s+/).map((w, wi) => currentWord(i, wi, w)).join(' ');
function svLines() {
  const sv = (state.song.lyrics_sv || []).filter(l => l.type === 'line');
  let n = 0;
  return (state.song.lyrics || []).map(l => l.type === 'line' ? (sv[n++]?.text || '') : '');
}

function renderText() {
  const song = state.song, hasFa = !!song.lyrics?.length, hasSv = !!song.lyrics_sv?.length;
  if (!hasFa && state.view !== 'sv') state.view = 'sv';
  app.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === state.view));
  const last = state.list[state.list.length - 1];
  $('toolbar').innerHTML = state.view === 'sv' || !hasFa ? '' : `
    <button class="btn small" id="undoBtn" ${last ? '' : 'disabled'}>↶ Ångra senaste${last ? ` (${esc(last.new_word ? last.word + ' → ' + last.new_word : last.word)})` : ''}</button>
    <button class="btn small" id="origBtn">${state.showOrig ? 'Visa ändrad text' : 'Visa original'}</button>`;
  $('origNotice').innerHTML = state.showOrig && state.view !== 'sv' ? '<div class="notice">Du ser originalet, så som texten laddades upp</div>' : '';
  const lyr = $('lyrics');

  if (state.view === 'sv') {
    lyr.innerHTML = hasSv
      ? (hasFa && lineCount(song.lyrics) !== lineCount(song.lyrics_sv) ? `<p class="help">Obs: svenska har ${lineCount(song.lyrics_sv)} rader, persiska ${lineCount(song.lyrics)}.</p>` : '')
        + song.lyrics_sv.map(l => l.type === 'tag' ? `<div class="tag">${esc(l.text)}</div>` : `<div class="sv">${esc(l.text)}</div>`).join('')
      : '<p class="help">Ingen svensk översättning än. Lägg till den under <i>Text</i> nedan.</p>';
  } else {
    const sv = svLines();
    lyr.innerHTML = song.lyrics.map((l, i) => {
      if (l.type === 'tag') return `<div class="tag">${esc(l.text)}</div>`;
      const words = l.text.split(/\s+/);
      return `<div class="line">${words.map((w, wi) => {
        const hits = editsFor(i, wi, w);
        const changed = hits.some(x => x.new_word), open = hits.some(x => x.status !== 'klar');
        const cls = state.showOrig ? 'w' : changed ? (open ? 'w chg open' : 'w chg') : hits.length ? (open ? 'w has' : 'w done') : 'w';
        return `<span class="${cls}" data-line="${i}" data-wi="${wi}">${esc(state.showOrig ? w : currentWord(i, wi, w))}</span>`;
      }).join(' ')}</div>${state.view === 'both' && sv[i] ? `<div class="sv-under">${esc(sv[i])}</div>` : ''}`;
    }).join('');
    lyr.querySelectorAll('.w').forEach(s => s.onclick = () => openSheet(+s.dataset.line, +s.dataset.wi));
  }
  const ub = $('undoBtn');
  if (ub) ub.onclick = async () => {
    ub.disabled = true;
    const { error } = await sb.from('corrections').delete().eq('id', last.id);
    if (error) { ub.disabled = false; return; }
    refreshEdits();
  };
  const ob = $('origBtn');
  if (ob) ob.onclick = () => { state.showOrig = !state.showOrig; renderText(); };
  renderCorrList();
}

async function refreshEdits() {
  const c = await sb.from('corrections').select('*').eq('song_id', state.song.id).order('created_at');
  state.list = c.data || [];
  renderText();
}

function renderCorrList() {
  const cl = $('corrList'), lyrics = state.song.lyrics || [];
  const items = [...state.list].sort((a, b) => a.line_index - b.line_index || a.created_at.localeCompare(b.created_at));
  cl.innerHTML = items.length ? items.map(x => `
    <div class="corr ${x.status === 'klar' ? 'done' : ''}">
      <div class="word fa" style="text-align:right">${x.new_word ? `${esc(x.word)} ← <span style="color:var(--gold)">${esc(x.new_word)}</span>` : esc(x.word)}</div>
      <div class="det fa" style="text-align:right;color:#b0a090;font-size:15px">${esc(lyrics[x.line_index]?.text || '')}</div>
      ${x.heard ? `<div class="det"><b>Hördes</b>${esc(x.heard)}</div>` : ''}
      ${x.should_sound ? `<div class="det"><b>Uttal</b>${esc(x.should_sound)}</div>` : ''}
      ${x.note ? `<div class="det"><b>Notering</b>${esc(x.note)}</div>` : ''}
      <div class="row">
        ${x.time_sec != null ? `<button class="btn small" data-seek="${x.id}">▶ ${fmtTime(x.time_sec)}</button>` : ''}
        <button class="btn small" data-toggle="${x.id}" data-status="${x.status}">${x.status === 'klar' ? 'Öppna igen' : 'Markera klar'}</button>
      </div>
    </div>`).join('') : '<p class="help">Inga ändringar än.</p>';
  cl.querySelectorAll('[data-seek]').forEach(b => b.onclick = () => {
    const x = state.list.find(e => same(e.id, b.dataset.seek));
    window.scrollTo({ top:0, behavior:'smooth' });
    if (x.take_id && !same(x.take_id, state.takeId) && state.songTakes.some(t => same(t.id, x.take_id))) {
      state.takeId = x.take_id; renderTakes(); return renderPlayer(x.time_sec);
    }
    const a = $('audio'); if (a) { a.currentTime = Math.max(0, x.time_sec - 2); a.play(); }
  });
  cl.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    await sb.from('corrections').update({ status: b.dataset.status === 'klar' ? 'ny' : 'klar' }).eq('id', b.dataset.toggle);
    refreshEdits();
  });
}

/* ---------- Word sheet ---------- */
function openSheet(lineIndex, wi) {
  const a = $('audio');
  const t = a ? a.currentTime : null;
  if (a) a.pause();
  const orig = state.song.lyrics[lineIndex].text.split(/\s+/)[wi];
  const cur = currentWord(lineIndex, wi, orig);
  const sv = svLines()[lineIndex];
  sheetInner.innerHTML = `
    <div class="eyebrow">Ändra ordet</div>
    <div class="big">${esc(cur)}</div>
    ${cur !== orig ? `<div class="ctx" style="margin-bottom:4px">Original: ${esc(orig)}</div>` : ''}
    <div class="ctx">${esc(currentLine(lineIndex))}</div>
    ${sv ? `<div class="sv-under" style="text-align:center;margin:-10px 0 18px">${esc(sv)}</div>` : ''}
    <label class="field"><span>Ordet ska vara</span><input type="text" id="cNew" class="fa" value="${esc(cur)}"></label>
    <label class="field"><span>Uttal: hur det ska låta</span><input type="text" id="cShould" placeholder="t.ex. to / طُ"></label>
    <label class="field"><span>Notering (frivilligt)</span><input type="text" id="cNote"></label>
    <label class="field"><span>Tid i ljudet</span><input type="text" id="cTime" value="${t != null ? fmtTime(t) : ''}" placeholder="m:ss"></label>
    <div class="row" style="margin-top:6px">
      <button class="btn" id="cSave" style="flex:1">Spara</button>
      <button class="btn" id="cCancel" style="flex:1">Avbryt</button>
    </div>
    <div class="err" id="cErr"></div>`;
  openSheetUI();
  $('cCancel').onclick = closeSheet;
  $('cSave').onclick = async () => {
    const nw = $('cNew').value.trim(), should = $('cShould').value.trim(), note = $('cNote').value.trim();
    const changed = nw && nw !== cur;
    if (!changed && !should && !note) { $('cErr').textContent = 'Ändra ordet, skriv uttalet eller en notering.'; return; }
    const tm = $('cTime').value.trim().match(/^(\d+):(\d{1,2})$/);
    const btn = $('cSave'); btn.disabled = true;
    const { error } = await sb.from('corrections').insert({
      song_id: state.song.id, take_id: state.takeId, line_index: lineIndex, word_index: wi, word: orig,
      new_word: changed ? nw : (cur !== orig ? cur : null),
      should_sound: should || null, note: note || null,
      time_sec: tm ? (+tm[1] * 60 + +tm[2]) : (t != null ? Math.round(t * 10) / 10 : null)
    });
    if (error) { btn.disabled = false; $('cErr').textContent = 'Kunde inte spara. Försök igen.'; return; }
    closeSheet(); refreshEdits();
  };
}

/* ---------- Manage: audio, text, song ---------- */
function bindManage() {
  const song = state.song;
  $('addAudioBtn').onclick = () => { $('addAudioBox').classList.remove('hidden'); $('addAudioBtn').classList.add('hidden'); };
  $('aCancel').onclick = () => { $('addAudioBox').classList.add('hidden'); $('addAudioBtn').classList.remove('hidden'); };
  $('aSave').onclick = async () => {
    const err = $('aErr'), btn = $('aSave'), file = $('aFile').files[0];
    if (!file) return err.textContent = 'Välj en ljudfil.';
    btn.disabled = true; btn.textContent = 'Laddar upp…';
    try {
      const t = await uploadAudio(song.id, file, $('aLabel').value.trim() || file.name.replace(/\.[^.]+$/, ''), $('aKind').value);
      state.takeId = t.id; renderSong(song.id);
    } catch (e) { btn.disabled = false; btn.textContent = 'Ladda upp'; err.textContent = uploadErr(e); }
  };

  if (song.lyrics?.length) {
    $('svEditBtn').onclick = () => { $('svBox').classList.remove('hidden'); $('svEditBtn').disabled = true; };
    $('svCancel').onclick = () => { $('svBox').classList.add('hidden'); $('svEditBtn').disabled = false; };
    $('svSave').onclick = async () => {
      const sv = parseLyrics($('svText').value);
      const { error } = await sb.from('songs').update({ lyrics_sv: sv.length ? sv : null }).eq('id', song.id);
      if (error) return $('svErr').textContent = 'Kunde inte spara. Försök igen.';
      renderSong(song.id);
    };
    $('delTextBtn').onclick = () => confirmDelete(
      `Texten till <b>${esc(song.title)}</b> raderas: originalet, den svenska översättningen och ${state.list.length} ändring${state.list.length === 1 ? '' : 'ar'}. Ljudfilerna finns kvar.`,
      async () => {
        const d = await sb.from('corrections').delete().eq('song_id', song.id); if (d.error) throw d.error;
        const u = await sb.from('songs').update({ lyrics: null, lyrics_sv: null }).eq('id', song.id); if (u.error) throw u.error;
        renderSong(song.id);
      });
  } else {
    $('tSave').onclick = async () => {
      const fa = parseLyrics($('tFa').value), sv = parseLyrics($('tSv').value);
      if (!fa.length) return $('tErr').textContent = 'Klistra in den persiska texten.';
      const { error } = await sb.from('songs').update({ lyrics: fa, lyrics_sv: sv.length ? sv : null }).eq('id', song.id);
      if (error) return $('tErr').textContent = 'Kunde inte spara. Försök igen.';
      renderSong(song.id);
    };
  }

  $('delSong').onclick = () => {
    const parts = [];
    if (song.lyrics?.length) parts.push('texten');
    if (song.lyrics_sv?.length) parts.push('den svenska översättningen');
    if (state.list.length) parts.push(`${state.list.length} ändring${state.list.length === 1 ? '' : 'ar'}`);
    if (state.songTakes.length) parts.push(`${state.songTakes.length} ljudfil${state.songTakes.length === 1 ? '' : 'er'}`);
    confirmDelete(`Hela låten <b>${esc(song.title)}</b> raderas för alltid${parts.length ? ': ' + parts.join(', ') : ''}. Videoklippen finns kvar under Videoklipp.`, async () => {
      const paths = state.songTakes.map(t => t.audio_path).filter(Boolean);
      if (paths.length) { const rm = await sb.storage.from('audio').remove(paths); if (rm.error) throw rm.error; }
      for (const [tbl, col] of [['corrections', 'song_id'], ['takes', 'song_id'], ['songs', 'id']]) {
        const d = await sb.from(tbl).delete().eq(col, song.id); if (d.error) throw d.error;
      }
      go('');
    });
  };
}

/* ---------- Sheets ---------- */
function openSheetUI() { sheetBg.style.display = 'block'; requestAnimationFrame(() => sheet.classList.add('open')); }
function confirmDelete(html, action) {
  const a = $('audio'); if (a) a.pause();
  sheetInner.innerHTML = `
    <div class="eyebrow" style="color:var(--red)">Radera</div>
    <div class="warn"><strong>⚠ Varning</strong>${html} Det går inte att ångra.</div>
    <div class="row">
      <button class="btn danger" id="dYes" style="flex:1;white-space:nowrap">Radera</button>
      <button class="btn" id="dNo" style="flex:1">Avbryt</button>
    </div>
    <div class="err" id="dErr"></div>`;
  openSheetUI();
  $('dNo').onclick = closeSheet;
  $('dYes').onclick = async () => {
    const btn = $('dYes'); btn.disabled = true; btn.textContent = 'Raderar…';
    try { await action(); closeSheet(); }
    catch (e) { btn.disabled = false; btn.textContent = 'Radera'; $('dErr').textContent = 'Kunde inte radera. Försök igen.'; }
  };
}
function closeSheet() { sheet.classList.remove('open'); setTimeout(() => sheetBg.style.display = 'none', 300); }
sheetBg.onclick = closeSheet;

/* ---------- Videos ---------- */
const SHORT_SEC = 60;
const MAX_VIDEO_MB = 50;
const fmtMB = b => (b / 1048576).toFixed(b < 10485760 ? 1 : 0) + ' MB';

async function signedUrls(paths) {
  const list = paths.filter(Boolean);
  if (!list.length) return {};
  const r = await sb.storage.from('video').createSignedUrls(list, 60 * 60 * 6);
  return Object.fromEntries((r.data || []).filter(x => x.signedUrl).map(x => [x.path, x.signedUrl]));
}

async function renderVideos() {
  app.innerHTML = `<p class="help" style="padding-top:40px">Hämtar…</p>`;
  await Promise.all([loadVideos(), sb.from('songs').select('id,title').then(r => { if (!r.error) state.songs = r.data; })]);
  const vids = state.videos.filter(v => state.vtab === 'all' || (state.vtab === 'short') === (+v.duration_sec < SHORT_SEC));
  const thumbs = await signedUrls(vids.map(v => v.thumb_path));
  const used = state.videos.reduce((n, v) => n + (+v.size_bytes || 0), 0);
  const songTitle = id => state.songs.find(s => same(s.id, id))?.title;
  app.innerHTML = `
  <section class="fade" style="padding-top:24px">
    ${sectionNav('video')}
    <div class="eyebrow" style="margin-top:22px"><span class="dot"></span>Studio</div>
    <h1>Video<em>klipp</em></h1>
    <p class="sub">Tryck på ett klipp för att titta</p>
    <div class="tabs">
      <button class="tab" data-vtab="short">Korta</button>
      <button class="tab" data-vtab="long">Långa</button>
      <button class="tab" data-vtab="all">Alla</button>
    </div>
    ${vids.length ? `<div class="grid">${vids.map(v => `
      <button class="vcard" data-vid="${v.id}">
        <div class="thumb" style="${thumbs[v.thumb_path] ? `background-image:url('${esc(thumbs[v.thumb_path])}')` : ''}"><span class="len">${fmtTime(v.duration_sec)}</span></div>
        <div class="card-title">${esc(v.title)}</div>
        ${songTitle(v.song_id) ? `<div class="card-meta" style="font-size:12px">${esc(songTitle(v.song_id))}</div>` : ''}
      </button>`).join('')}</div>`
    : `<p class="help" style="margin-top:18px">Inga ${state.vtab === 'short' ? 'korta ' : state.vtab === 'long' ? 'långa ' : ''}videoklipp än.</p>`}
    <div class="rule"></div>
    <button class="btn full" id="newVideoBtn">+ Lägg till video</button>
    <p class="help" style="text-align:center;margin-top:10px;font-size:14px">Videolagring: ${fmtMB(used)} av ca 1 000 MB</p>
  </section>`;
  bindNav();
  app.querySelectorAll('[data-vtab]').forEach(b => { b.classList.toggle('on', b.dataset.vtab === state.vtab); b.onclick = () => { state.vtab = b.dataset.vtab; renderVideos(); }; });
  app.querySelectorAll('[data-vid]').forEach(b => b.onclick = () => go('video/' + b.dataset.vid));
  $('newVideoBtn').onclick = () => { state.newVideoSong = null; go('video/ny'); };
}

async function renderVideo(id) {
  app.innerHTML = `<p class="help" style="padding-top:40px">Hämtar…</p>`;
  const r = await sb.from('videos').select('*, songs(id,title)').eq('id', id).single();
  if (r.error) { app.innerHTML = `<p class="err" style="padding-top:40px">Videoklippet hittades inte.</p>`; return; }
  const v = r.data;
  const fname = v.title.replace(/[\\/:*?"<>|]+/g, '').trim() + '.' + (v.path.split('.').pop() || 'mp4');
  const [play, dl] = await Promise.all([
    sb.storage.from('video').createSignedUrl(v.path, 60 * 60 * 6),
    sb.storage.from('video').createSignedUrl(v.path, 60 * 60 * 6, { download: fname })
  ]);
  app.innerHTML = `
  <section class="fade" style="padding-top:28px">
    <button class="linkbtn" id="backBtn">← Alla videoklipp</button>
    <div class="eyebrow" style="margin-top:18px"><span class="dot"></span>${fmtTime(v.duration_sec)}${v.songs ? ' · ' + esc(v.songs.title) : ''}</div>
    <h1 style="font-size:clamp(28px,7vw,40px)">${esc(v.title)}</h1>
    ${play.error ? '<p class="err">Videon kunde inte hämtas.</p>' : `<video class="vplayer" controls playsinline preload="metadata" src="${esc(play.data.signedUrl)}"></video>`}
    ${dl.error ? '' : `<a class="btn full" href="${esc(dl.data.signedUrl)}" download="${esc(fname)}">⬇ Ladda ner</a>`}
    ${v.songs ? `<p style="margin-top:16px;text-align:center"><button class="linkbtn" id="toSong">Till låten: ${esc(v.songs.title)} →</button></p>` : ''}
    <div class="rule"></div>
    <button class="btn danger full" id="delVideo">Ta bort videoklippet</button>
  </section>`;
  $('backBtn').onclick = () => go('video');
  if (v.songs) $('toSong').onclick = () => go('song/' + v.songs.id);
  $('delVideo').onclick = () => confirmDelete(`Videoklippet <b>${esc(v.title)}</b> raderas för alltid.`, async () => {
    const rm = await sb.storage.from('video').remove([v.path, v.thumb_path].filter(Boolean)); if (rm.error) throw rm.error;
    const d = await sb.from('videos').delete().eq('id', v.id); if (d.error) throw d.error;
    go('video');
  });
}

// Läser längd och tar en miniatyrbild ur videon direkt i webbläsaren.
function probeVideo(file) {
  return new Promise(resolve => {
    const v = document.createElement('video'), url = URL.createObjectURL(file);
    let done = false;
    const finish = r => { if (done) return; done = true; URL.revokeObjectURL(url); resolve(r); };
    setTimeout(() => finish({ duration: isFinite(v.duration) ? v.duration : null, thumb: null }), 15000);
    v.muted = true; v.playsInline = true; v.preload = 'auto';
    v.onloadedmetadata = () => { v.currentTime = Math.min(1, (v.duration || 0) / 10); };
    v.onseeked = () => {
      const c = document.createElement('canvas');
      c.width = 480; c.height = Math.round(480 * (v.videoHeight || 270) / (v.videoWidth || 480));
      try { c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); }
      catch (e) { return finish({ duration: v.duration, thumb: null }); }
      c.toBlob(b => finish({ duration: v.duration, thumb: b }), 'image/jpeg', 0.8);
    };
    v.onerror = () => finish({ duration: null, thumb: null });
    v.src = url;
  });
}

async function renderVideoNew() {
  if (!state.songs.length) { const r = await sb.from('songs').select('id,title'); if (!r.error) state.songs = r.data; }
  app.innerHTML = `
  <section class="fade" style="padding-top:28px">
    <button class="linkbtn" id="backBtn">← Tillbaka</button>
    <div class="eyebrow" style="margin-top:18px"><span class="dot"></span>Videoklipp</div>
    <h1 style="font-size:clamp(32px,8vw,46px)">Ny <em>video</em></h1>
    <p class="help">Max ${MAX_VIDEO_MB} MB. Är filen större: dra den på <i>Krymp video för Lyssna</i> på skrivbordet och ladda upp filen som slutar på <i>_lyssna.mp4</i>.</p>
    <div class="rule"></div>
    <label class="field"><span>Videofil</span><input type="file" id="vFile" accept="video/*"></label>
    <div class="help" id="vInfo"></div>
    <label class="field" style="margin-top:14px"><span>Titel</span><input type="text" id="vTitle"></label>
    <label class="field"><span>Hör till låt (frivilligt)</span>
      <select id="vSong"><option value="">Ingen låt</option>${state.songs.map(s => `<option value="${s.id}" ${same(s.id, state.newVideoSong) ? 'selected' : ''}>${esc(s.title)}</option>`).join('')}</select></label>
    <button class="btn full" id="vSave">Ladda upp</button>
    <div class="err" id="vErr"></div>
  </section>`;
  $('backBtn').onclick = () => history.back();
  const fileIn = $('vFile');
  fileIn.onchange = () => {
    const f = fileIn.files[0]; $('vErr').textContent = '';
    if (!f) return $('vInfo').textContent = '';
    if (!$('vTitle').value) $('vTitle').value = f.name.replace(/\.[^.]+$/, '').replace(/_lyssna$/, '');
    $('vInfo').textContent = fmtMB(f.size);
    if (f.size > MAX_VIDEO_MB * 1048576) $('vErr').textContent = `Filen är ${fmtMB(f.size)}, max ${MAX_VIDEO_MB} MB. Krymp den först med "Krymp video för Lyssna" på skrivbordet.`;
  };
  $('vSave').onclick = async () => {
    const err = $('vErr'), btn = $('vSave'), f = fileIn.files[0], title = $('vTitle').value.trim();
    if (!f) return err.textContent = 'Välj en videofil.';
    if (f.size > MAX_VIDEO_MB * 1048576) return err.textContent = `Filen är för stor (${fmtMB(f.size)}). Krymp den först.`;
    if (!title) return err.textContent = 'Skriv en titel.';
    btn.disabled = true; btn.textContent = 'Förbereder…'; err.textContent = '';
    const { duration, thumb } = await probeVideo(f);
    const base = `${Date.now()}`, ext = (f.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '');
    const path = `${base}.${ext}`, thumbPath = thumb ? `${base}.jpg` : null;
    btn.textContent = 'Laddar upp… (kan ta en stund)';
    try {
      const up = await sb.storage.from('video').upload(path, f, { contentType: f.type || 'video/mp4' });
      if (up.error) throw up.error;
      if (thumb) { const ut = await sb.storage.from('video').upload(thumbPath, thumb, { contentType: 'image/jpeg' }); if (ut.error) throw ut.error; }
      const ins = await sb.from('videos').insert({ title, path, thumb_path: thumbPath, duration_sec: duration ? Math.round(duration * 10) / 10 : null, size_bytes: f.size, song_id: $('vSong').value || null }).select().single();
      if (ins.error) throw ins.error;
      state.vtab = duration != null && duration < SHORT_SEC ? 'short' : 'long';
      go('video/' + ins.data.id);
    } catch (e) {
      sb.storage.from('video').remove([path, thumbPath].filter(Boolean));
      btn.disabled = false; btn.textContent = 'Ladda upp';
      err.textContent = 'Uppladdningen misslyckades' + (e?.message?.includes('size') || e?.message?.includes('large') ? ': filen är för stor.' : '. Försök igen.');
    }
  };
}

/* ---------- New song ---------- */
function renderNew() {
  app.innerHTML = `
  <section class="fade" style="padding-top:28px">
    <button class="linkbtn" id="backBtn">← Alla låtar</button>
    <div class="eyebrow" style="margin-top:18px"><span class="dot"></span>Studio</div>
    <h1 style="font-size:clamp(32px,8vw,46px)">Ny <em>låt</em></h1>
    <p class="help">Bara titeln krävs. Text och ljud kan läggas till nu eller senare.</p>
    <div class="rule"></div>
    <label class="field"><span>Låtens titel</span><input type="text" id="nTitle" placeholder="t.ex. Vaght Nadaram (وقت ندارم) – &quot;No Time&quot;"></label>
    <label class="field"><span>Artist</span><input type="text" id="nArtist" value="Mah-o-Dasht"></label>
    <label class="field"><span>Persisk text (klistra in från Suno)</span><textarea id="nLyrics" class="fa" style="min-height:200px"></textarea></label>
    <label class="field"><span>Svensk översättning (en rad per persisk rad)</span><textarea id="nSv" style="min-height:160px"></textarea></label>
    <label class="field"><span>Ljudfil (mp3)</span><input type="file" id="nFile" accept="audio/*"></label>
    <div id="nAudioOpts" class="hidden">
      <label class="field"><span>Namn på ljudfilen</span><input type="text" id="nLabel" placeholder="t.ex. A cappella-test 1"></label>
      <label class="field"><span>Typ</span><select id="nKind"><option value="acappella">A cappella</option><option value="full">Hela låten</option></select></label>
    </div>
    <button class="btn full" id="nSave">Spara</button>
    <div class="err" id="nErr"></div>
  </section>`;
  $('backBtn').onclick = () => go('');
  $('nFile').onchange = () => $('nAudioOpts').classList.toggle('hidden', !$('nFile').files[0]);
  $('nSave').onclick = async () => {
    const err = $('nErr'), btn = $('nSave'); err.textContent = '';
    const title = $('nTitle').value.trim(), file = $('nFile').files[0];
    const fa = parseLyrics($('nLyrics').value), sv = parseLyrics($('nSv').value);
    if (!title) return err.textContent = 'Skriv låtens titel.';
    btn.disabled = true; btn.textContent = file ? 'Laddar upp…' : 'Sparar…';
    const s = await sb.from('songs').insert({ title, artist: $('nArtist').value.trim() || 'Mah-o-Dasht', lyrics: fa.length ? fa : null, lyrics_sv: sv.length ? sv : null }).select().single();
    if (s.error) { btn.disabled = false; btn.textContent = 'Spara'; return err.textContent = 'Kunde inte spara. Försök igen.'; }
    if (file) {
      try { state.takeId = (await uploadAudio(s.data.id, file, $('nLabel').value.trim() || file.name.replace(/\.[^.]+$/, ''), $('nKind').value)).id; }
      catch (e) { alert(uploadErr(e) + ' Låten är sparad – lägg till ljudet på låtsidan.'); }
    }
    go('song/' + s.data.id);
  };
}
